[project]
name = "beatprints-open"
version = "1.1.6.post1"
description = "Create Pinterest-style music posters with open metadata providers."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "CC-BY-NC-SA-4.0"
authors = [{ name = "elysianmyst", email = "74355265+TrueMyst@users.noreply.github.com" }]
keywords = ["music", "lyrics", "pinterest", "lrclibapi", "itunes", "deezer"]
dependencies = [
    "requests",
    "pylette",
    "pillow",
    "lrclibapi",
    "fonttools",
    "questionary",
    "rich",
    "toml",
    "qrcode",
]

[project.urls]
Repository = "https://github.com/pommotion/BeatPrints-Open"

[project.scripts]
beatprints = "cli.prompt:main"
beatprints-web = "web.app:main"

[tool.poetry]
name = "BeatPrints-Open"
version = "1.1.6.post1"
description = "Create Pinterest-style music posters with open metadata providers."
authors = ["elysianmyst <74355265+TrueMyst@users.noreply.github.com>"]
license = "CC-BY-NC-SA-4.0"
readme = "README.md"

keywords = ["music", "lyrics", "pinterest", "lrclibapi", "itunes", "deezer"]
repository = "https://github.com/pommotion/BeatPrints-Open"

packages = [{ include = "BeatPrints" }, { include = "cli" }, { include = "web" }]

[tool.poetry.dependencies]
python = "^3.12"
requests = "*"
pylette = "*"
pillow = "*"
lrclibapi = "*"
fonttools = "*"
questionary = "*"
rich = "*"
toml = "*"
qrcode = "*"

[tool.poetry.scripts]
beatprints = 'cli.prompt:main'
beatprints-web = 'web.app:main'

[tool.poetry.group.dev.dependencies]
black = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

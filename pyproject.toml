[tool.poetry]
name = "BeatPrints-Open"
version = "1.1.5.post1"
description = "Create Pinterest-style music posters with open metadata providers."
authors = ["elysianmyst <74355265+TrueMyst@users.noreply.github.com>"]
license = "CC-BY-NC-SA-4.0"
readme = "README.md"

keywords = ["music", "lyrics", "pinterest", "lrclibapi", "itunes", "deezer"]
repository = "https://github.com/pommotion/BeatPrints-Open"

packages = [{ include = "BeatPrints" }, { include = "cli" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.3"
pylette = "^4.0.0"
pillow = ">=9.3,<11.0"
lrclibapi = "^0.3.1"
fonttools = "^4.54.1"
questionary = "^2.0.1"
rich = "^13.9.4"
toml = "^0.10.2"
qrcode = "^8.2"

[tool.poetry.scripts]
beatprints = 'cli.prompt:main'

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
